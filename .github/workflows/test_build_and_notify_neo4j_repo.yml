name: Build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          echo "Building..."
          # your build commands here

  notify-repository-a:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Repository A
        env:
          GH_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          gh api \
            --method POST \
            /repos/AlyLanier/neo4j2graph/dispatches \
            -f event_type='repository-b-completed'